AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Parameters:
  Stage:
    Type: String
    Default: prod
    Description: Stage name for the deployment
    AllowedValues:
    - dev
    - staging
    - prod
Resources:
  GetArticlesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetArticlesFunction
      Handler: functions/get-articles/index.lambda_handler
      Runtime: python3.9
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          STAGE:
            Ref: Stage
      Events:
        GetArticles:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiGateway
            Path: /articles
            Method: get
    Metadata:
      SamResourceId: GetArticlesFunction
  GetArticleByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetArticleByIdFunction
      Handler: functions/get-article-by-id/index.lambda_handler
      Runtime: python3.9
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          STAGE:
            Ref: Stage
      Events:
        GetArticleById:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiGateway
            Path: /articles/{id}
            Method: get
    Metadata:
      SamResourceId: GetArticleByIdFunction
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: GlobalNewsApi
      StageName:
        Ref: Stage
      DefinitionBody:
        swagger: '2.0'
        paths:
          /articles:
            get:
              x-amazon-apigateway-integration:
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetArticlesFunction.Arn}/invocations
                httpMethod: POST
                type: aws_proxy
          /articles/{id}:
            get:
              x-amazon-apigateway-integration:
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetArticleByIdFunction.Arn}/invocations
                httpMethod: POST
                type: aws_proxy
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/
  GetArticlesFunctionArn:
    Description: GetArticles Lambda Function ARN
    Value:
      Fn::GetAtt:
      - GetArticlesFunction
      - Arn
  GetArticleByIdFunctionArn:
    Description: GetArticleById Lambda Function ARN
    Value:
      Fn::GetAtt:
      - GetArticleByIdFunction
      - Arn
