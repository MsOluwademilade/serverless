AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Parameters:
  Stage:
    Type: String
    Default: prod
    Description: Stage name for the deployment
    AllowedValues:
    - dev
    - staging
    - prod
Resources:
  ArticlesTable:
    Type: AWS::DynamoDB::GlobalTable
    Properties:
      TableName:
        Fn::Sub: Articles-${Stage}
      AttributeDefinitions:
      - AttributeName: id
        AttributeType: S
      KeySchema:
      - AttributeName: id
        KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Replicas:
      - Region: us-east-1
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
        - Key: Environment
          Value:
            Ref: Stage
        - Key: Region
          Value: us-east-1
      - Region: eu-west-1
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
        - Key: Environment
          Value:
            Ref: Stage
        - Key: Region
          Value: eu-west-1
  GetArticlesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetArticlesFunction
      Handler: functions/get-articles/index.lambda_handler
      Runtime: python3.9
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          STAGE:
            Ref: Stage
          TABLE_NAME:
            Ref: ArticlesTable
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: ArticlesTable
      Events:
        GetArticles:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiGateway
            Path: /articles
            Method: GET
    Metadata:
      SamResourceId: GetArticlesFunction
  GetArticleByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: GetArticleByIdFunction
      Handler: functions/get-article-by-id/index.lambda_handler
      Runtime: python3.9
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          STAGE:
            Ref: Stage
          TABLE_NAME:
            Ref: ArticlesTable
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: ArticlesTable
      Events:
        GetArticleById:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiGateway
            Path: /articles/{id}
            Method: GET
    Metadata:
      SamResourceId: GetArticleByIdFunction
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: GlobalNewsApi-${Stage}
      StageName:
        Ref: Stage
      Cors:
        AllowMethods: '''GET, POST, OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/
  ArticlesTableName:
    Description: DynamoDB Table Name
    Value:
      Ref: ArticlesTable
  GetArticlesEndpoint:
    Description: GET /articles endpoint
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/articles
  GetArticleByIdEndpoint:
    Description: GET /articles/{id} endpoint
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/articles/{id}
  TableReplicationRegions:
    Description: Regions where the table is replicated
    Value: us-east-1, eu-west-1
